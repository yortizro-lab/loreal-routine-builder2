
name = "loreal-routine-builder2"
compatibility_date = "2026-11-20"
main = "src/index.ts"

[vars]
OPENAI_MODEL = "gpt-4.1"
ENABLE_WEB_SEARCH = "false"

[assets]
directory = "./public"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
